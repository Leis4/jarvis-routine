<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<style>
/* ── Design System ── */
:root{--bg:#0b1120;--bg2:#111b2e;--card:#142036;--line:rgba(255,255,255,.07);--text:#eef3fc;--sub:#9aaec8;--muted:#6a7f9c;--accent:#7cb3ff;--green:#5ed5a8;--orange:#fbb68a;--radius:12px;--navH:56px;color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--bg);color:var(--text);letter-spacing:-.01em;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(var(--navH) + 84px)}
button,input,select,textarea{font:inherit;outline:none}
button{cursor:pointer;background:none;border:none;color:inherit;padding:0;font-size:inherit;min-height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center;gap:4px;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.4}
#app{max-width:720px;margin:0 auto;padding:6px 14px 16px}
a{color:var(--accent)}

/* ── Top Bar ── */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:8px 0 6px;min-height:44px}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none}
.brand-icon{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#7cb3ff,#b097ff);display:grid;place-items:center;font-size:16px;font-weight:800;color:#0b112b}
.brand small{font-size:8px;color:var(--sub);letter-spacing:.18em;display:block;line-height:1.1}
.brand b{font-size:14px;display:block}
.top-actions{display:flex;gap:4px}
.iconbtn{width:36px;height:36px;border-radius:100px;background:var(--card);color:var(--sub);font-size:16px;border:1px solid var(--line)}.iconbtn:active{background:var(--bg2)}

/* ── Bottom Nav (4 tabs, one row) ── */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:50;background:#0e1628f2;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:4px env(safe-area-inset-right,12px) calc(4px + env(safe-area-inset-bottom,0px)) env(safe-area-inset-left,12px)}
.nav-inner{display:grid;grid-template-columns:repeat(4,1fr);max-width:480px;margin:0 auto;gap:2px}
.navbutton{border-radius:10px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:9px;font-weight:600;color:var(--muted);min-height:44px;transition:color .15s;flex:1}
.navbutton .ico{font-size:20px;line-height:1.2}
.navbutton.active{color:var(--text);background:var(--card)}

/* ── Generic ── */
.sectiontitle{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin:16px 0 6px;padding:0 2px}
.subhead{display:flex;align-items:center;justify-content:space-between;margin:12px 0 4px;gap:8px}.subhead h2{font-size:15px;font-weight:700;margin:0}
.tagline{font-size:10px;color:var(--sub);line-height:1.4;margin:2px 0}.infotext{font-size:11px;color:var(--sub);line-height:1.5;margin:4px 0}
.divider{height:1px;background:var(--line);margin:10px 0}.empty{text-align:center;color:var(--muted);padding:24px 0;font-size:13px}
.eyebrow{font-size:9px;font-weight:700;color:var(--accent);letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px}
.pills{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0 0}.pill{font-size:11px;background:var(--bg2);padding:3px 8px;border-radius:100px;color:var(--sub);white-space:nowrap}

/* ── Today View ── */
.today-header{display:flex;align-items:center;justify-content:space-between;margin:4px 0 10px;gap:8px}
.today-date{font-size:17px;font-weight:700;line-height:1.2}.today-date small{display:block;font-size:12px;font-weight:400;color:var(--sub);margin-top:1px}
.today-progress{text-align:right;flex:none}.today-progress b{font-size:18px;font-weight:800;color:var(--green)}.today-progress small{font-size:9px;color:var(--muted);display:block}
.now-bar{background:var(--card);border-radius:var(--radius);padding:10px 12px;margin:6px 0 12px;border:1px solid var(--line);display:flex;align-items:center;gap:10px;min-height:44px}
.now-bar .ico{font-size:18px;color:var(--accent);flex:none}.now-bar .body{flex:1;min-width:0}.now-bar .body b{display:block;font-size:13px;font-weight:700}.now-bar .body small{font-size:10px;color:var(--sub);display:block;margin-top:1px}
.now-bar .time{font-size:12px;font-weight:600;color:var(--green);flex:none;text-align:right;line-height:1.3}.now-bar .time small{font-size:10px;color:var(--sub);display:block}

/* ── Task Row Compact ── */
.task-list{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin:4px 0}
.task-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);cursor:default;transition:opacity .2s;min-height:44px}
.task-row:last-child{border-bottom:none}.task-row.past{opacity:.5}.task-row.noww{background:var(--bg2)}
.task-row.done{opacity:.45}.task-row.done .task-name{text-decoration:line-through;color:var(--muted)}
.task-time{width:42px;flex:none;text-align:center;font-size:10px;color:var(--sub);line-height:1.2}.task-time b{display:block;font-size:12px;font-weight:700;color:var(--text)}
.cat-dot{width:3px;border-radius:2px;align-self:stretch;flex:none;min-height:20px}
.mark-gym{background:var(--green)}.mark-code{background:var(--accent2, #b097ff)}.mark-edu{background:var(--accent)}.mark-personal{background:var(--orange)}
.task-name{flex:1;min-width:0;font-size:13px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.task-name small{display:block;font-size:10px;font-weight:400;color:var(--sub);margin-top:1px}
/* Compact schedule mode: hide the category/note subline and tighten the row so a
   full day fits on a phone screen; the expand panel keeps every action. */
.task-row.condensed{min-height:34px;padding-top:5px;padding-bottom:5px}
.task-row.condensed .task-name small{display:none}
.task-row.condensed .task-name{-webkit-line-clamp:1}
.density-toggle{width:100%;margin-top:2px}
.task-check{width:22px;height:22px;border-radius:6px;border:2px solid var(--muted);background:transparent;flex:none;appearance:none;cursor:pointer;display:grid;place-items:center;transition:all .15s;min-width:22px}
.task-check:checked{background:var(--green);border-color:var(--green)}
.task-check:checked:after{content:'✓';font-size:13px;font-weight:800;color:#0b1b21}
.task-check.buffer{border-color:#4a5870;border-radius:50%;height:12px;width:12px;min-width:12px;opacity:.4;pointer-events:none}

/* ── Task Details (expandable) ── */
.task-details{display:none;padding:4px 10px 10px 63px;font-size:11px;color:var(--sub);line-height:1.5;border-bottom:1px solid var(--line);background:var(--bg2)}
.task-details.open{display:block}
.task-details .actions{display:flex;gap:6px;flex-wrap:wrap;margin:5px 0 0}
.task-details .actions button{font-size:10px;padding:5px 9px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--sub);min-height:30px;min-width:30px}
.task-details .actions button:active{background:var(--bg2)}
.task-details .smart-task-actions{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0}
.task-details .smart-task-actions button{font-size:9px;padding:4px 7px;border-radius:8px;border:1px solid var(--line);background:var(--bg2);color:var(--sub);min-height:28px}
.task-details .smart-task-actions button:active{background:var(--card)}
.task-details .smart-task-actions .model-hint{font-size:8px;color:var(--muted);margin-top:4px}
.task-details .smart-locked{font-size:10px;color:var(--muted)}
.task-details .smart-divide{height:1px;background:var(--line);margin:4px 0}
.swap-selected{background:var(--green20)}
.task-details .note{font-size:10px;color:var(--muted);margin-bottom:4px}

/* ── Wake Panel ── */
.wakepanel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px;margin:6px 0}
.wakepanel .wakehead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.wakepanel .waketime{font-size:20px;font-weight:800;color:var(--green);font-variant-numeric:tabular-nums}
.wakepanel input[type=range]{width:100%;accent-color:var(--accent);margin:6px 0 2px;height:24px}
.wakepanel .hint{font-size:10px;color:var(--sub);line-height:1.4}
.wakeactions{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0}
.wakeconflict{background:#3a2525;border:1px solid #c77b7b50;color:#f0c8c8;border-radius:8px;padding:7px 9px;font-size:10px;line-height:1.4;margin:6px 0}

/* ── Date Strip ── */
.date-strip{display:flex;gap:3px;margin:4px 0 8px}
.date-chip{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;padding:5px 1px;border-radius:8px;background:var(--card);font-size:10px;color:var(--sub);gap:2px;border:1px solid transparent;min-height:42px}
.date-chip.active{background:var(--accent);color:#0b112b;border-color:var(--accent);font-weight:700}
.date-chip b{font-size:12px;font-weight:700;display:block}.date-chip small{opacity:.7}

/* ── Filter Buttons ── */
.filter-row{display:flex;gap:4px;margin:6px 0}.filter-row button{flex:1;padding:5px 4px;border-radius:8px;border:1px solid var(--line);font-size:11px;color:var(--sub);min-height:32px;background:var(--bg2)}.filter-row button.active{background:var(--card);color:var(--text);border-color:var(--accent)}

/* ── Card ── */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin:6px 0}.card.compact{padding:8px 10px}.card .card{padding:8px;margin:0}

/* ── Habit Row ── */
.habit-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);min-height:40px}
.habit-row:last-child{border-bottom:none}.habit-row label{font-size:12px;flex:1;line-height:1.3}
.habit-row small{display:block;font-size:9px;color:var(--muted);margin-top:1px}
.habit-inline{display:flex;align-items:center;gap:10px;font-size:12px}

/* ── Week Card ── */
.week-card{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin:3px 0;width:100%;text-align:left;color:var(--text);min-height:44px}
.week-card .dc{width:34px;text-align:center;flex:none}.week-card .dc small{font-size:10px;color:var(--sub)}.week-card .dc b{font-size:14px;font-weight:700;display:block}
.week-card .wc{flex:1;min-width:0}.week-card .wc b{font-size:12px}.week-card .wc p{font-size:12px;color:var(--sub);margin:1px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.week-card .pct{font-size:12px;font-weight:700;color:var(--green);flex:none}

/* ── Stats ── */
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin:6px 0}
.stat-card{padding:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius)}.stat-card b{display:block;font-size:20px;margin:2px 0}.stat-card small{font-size:12px;color:var(--sub);display:block}

/* ── Focus Timer ── */
.focus-clock{font-size:48px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;margin:8px 0;color:var(--accent)}
.mode-row{display:flex;gap:6px;margin:8px 0}.mode-row button{flex:1;padding:8px;border-radius:8px;border:1px solid var(--line);font-size:11px;color:var(--sub);min-height:36px}.mode-row button.sel{background:var(--card);border-color:var(--accent);color:var(--text)}

/* ── Button ── */
.btn{border-radius:8px;padding:7px 11px;font-size:11px;font-weight:650;background:var(--card);border:1px solid var(--line);color:var(--text);min-height:36px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#0b112b}.btn.tight{padding:4px 8px;font-size:10px;min-height:30px}.btn.negative{background:#3a2525;border-color:#c77b7b40;color:#f5c8c8}.btn:active{background:var(--bg2)}

/* ── Sub-nav (more tab) ── */
.sub-nav{display:flex;gap:4px;margin:6px 0 10px;flex-wrap:wrap;padding:0 0 2px}.sub-nav button{flex:1 1 auto;min-width:0;padding:5px 10px;border-radius:8px;border:1px solid var(--line);font-size:10px;color:var(--sub);background:var(--bg2);min-height:32px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub-nav button.sel{background:var(--card);color:var(--text);border-color:var(--accent)}

/* ── Modal ── */
.modal-back{position:fixed;inset:0;z-index:60;background:#000000a0;display:none;align-items:end;justify-content:center}.modal-back.show{display:flex}
.modal{background:var(--bg2);border:1px solid var(--line);border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-width:500px;width:100%;max-height:85vh;overflow-y:auto}
.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.modalhead h2{font-size:15px;margin:0}

/* ── Forms ── */
.form-group{margin:6px 0}.form-group label{display:block;font-size:10px;color:var(--sub);margin-bottom:2px}
.field{width:100%;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;padding:9px 11px;font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hidden{display:none!important}
.day-checkboxes{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}.day-checkboxes label{background:var(--card);padding:5px 8px;border-radius:6px;font-size:10px;min-height:30px;display:flex;align-items:center;gap:3px}
.deadline-line{padding:6px 0;border-bottom:1px solid var(--line)}.deadline-line:last-child{border-bottom:0}.deadline-line b{font-size:12px}.deadline-line small{display:block;font-size:9px;color:var(--sub);margin-top:1px}

/* ── Progress bar ── */
.progress-bar{background:var(--bg2);border-radius:99px;height:3px;overflow:hidden}.progress-bar span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--green));border-radius:99px;transition:width .3s}

/* ── Streak ── */
.streak{display:flex;flex-wrap:wrap;gap:3px;margin:6px 0}.streak b{width:28px;height:28px;display:grid;place-items:center;border-radius:6px;background:var(--card);font-size:10px;color:var(--muted)}.streak b.good{background:var(--green);color:#0b1b21}.streak b.nodata{opacity:.4}

/* ── Footer & Toast ── */
.footerline{text-align:center;font-size:8px;color:var(--muted);margin:12px 0 4px;letter-spacing:.12em}
.toast{position:fixed;z-index:70;bottom:calc(var(--navH) + 20px);left:50%;transform:translateX(-50%);background:var(--card);color:var(--text);border-radius:10px;padding:10px 16px;font-size:12px;font-weight:600;border:1px solid var(--line);max-width:85%;text-align:center}

/* ── Animations ── */
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
@keyframes checkPop{0%{transform:scale(1)}50%{transform:scale(1.2)}100%{transform:scale(1)}}
.animate-in{animation:fadeIn .2s ease-out}
.animate-check:checked{animation:checkPop .2s ease-out}
@media(prefers-reduced-motion:reduce){.animate-in,.animate-check{animation:none!important}.task-row{transition:none!important}}

/* ── Responsive ── */
@media(max-width:380px){.task-time{width:36px}.task-name{font-size:12px}.today-date{font-size:15px}}
@media(min-width:600px){#app{padding:6px 24px 16px}}

<script>
const SCHEDULE_STATE={status:'loading',message:''};
let PLANS=[]; /* PRIVACY: personal 392-block schedule removed from public HTML. Loaded at runtime from private storage by schedule-bootstrap.js (D1 or local import). */
const WEEKDAYS=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'],DAYSFULL=['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'],MON=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
let HABITS=[]; /* PRIVACY: personal habits removed from public HTML. Loaded with the private schedule template. */
function scheduleReady(){return Array.isArray(PLANS)&&PLANS.length>0}
function planDay(s){const w=PLANS[parity(s)];const d=Array.isArray(w)?w[indexDay(s)]:null;return Array.isArray(d)?d:[]}
function scheduleBanner(){if(SCHEDULE_STATE.status==='ready')return '';
 const label=SCHEDULE_STATE.status==='loading'?'Загружаю расписание…':SCHEDULE_STATE.status==='missing'?'Расписание ещё не загружено на этом устройстве':SCHEDULE_STATE.message||'Нет доступа к расписанию';
 return `<div class="card sched-banner" role="status"><b>${safe(label)}</b><p class="tagline">Личное расписание хранится приватно и загружается один раз с твоего сервера; сами данные остаются на этом устройстве.</p><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn tight" data-sched-action="fetch">Подключить сервер</button><button class="btn tight" data-sched-action="import">Импорт файла</button>${scheduleReady()?'<button class="btn tight" data-sched-action="export">Скачать копию</button>':''}</div></div>`}
const STORE='jarvis_routine_v1';let S;try{S=JSON.parse(localStorage.getItem(STORE))||{}}catch(e){S={}};S={done:{},habits:{},overrides:{},extras:[],logs:{},anchor:null,shave:null,wakeTimes:{},...S};
function persist(){
 const api=storeApi();
 if(!api){try{localStorage.setItem(STORE,JSON.stringify(S));return true}catch(e){storageProblem('unavailable');return false}}
 const r=api.put(STORE,S);
 if(!r.ok)storageProblem(r.reason);
 else clearStorageProblem();
 return r.ok;
}
function storeApi(){try{return(typeof JarvisStore!=='undefined'&&JarvisStore)||null}catch(e){return null}}
const STORAGE_REASON={quota:'На устройстве закончилось место для сохранения. Выгрузи копию и освободи место.',unavailable:'Браузер запретил сохранение (приватный режим?). Выгрузи копию.',verify:'Сохранение не подтвердилось. Выгрузи копию.',io:'Ошибка записи. Выгрузи копию.',serialize:'Данные повреждены и не сохранились.'};
function storageProblem(reason){
 let el=document.getElementById('storageWarn');
 if(!el){el=document.createElement('div');el.id='storageWarn';el.className='storage-warn';el.setAttribute('role','alert');document.body.append(el)}
 el.innerHTML=`<b>Не сохраняется</b><span>${safe(STORAGE_REASON[reason]||'Изменения могут не сохраниться.')}</span><button class="btn tight" data-action="export">Выгрузить</button>`;
}
function clearStorageProblem(){const el=document.getElementById('storageWarn');if(el)el.remove()}
async function storageReport(){
 const api=storeApi();if(!api){toast('StorageAdapter недоступен');return}
 let h;try{h=await api.healthCheck()}catch(e){toast('Не удалось проверить хранилище');return}
 const cmp=h.shadow.compare;
 const mb=document.getElementById('modalbox'),back=document.getElementById('modalback');
 mb.innerHTML=`<div class="card"><div class="eyebrow">ХРАНИЛИЩЕ</div>
  <p class="tagline">Схема ${Number(h.schema)||1} · ключей ${h.keys} · ${Math.round((h.bytes||0)/1024)} КБ</p>
  <p class="tagline">Источник истины: ${safe(h.backend)}</p>
  <p class="tagline">Теневая копия (Dexie): ${h.shadow.open?(cmp&&cmp.inSync?'синхронна':'есть расхождение'):'недоступна'}</p>
  <p class="tagline">${h.lastWrite?(h.lastWrite.ok?'Последняя запись: успешна':'Последняя запись: ошибка ('+safe(h.lastWrite.reason)+')'):'Записей в этой сессии не было'}</p>
  <div style="display:flex;gap:6px;margin-top:8px"><button class="btn tight" data-action="storageSync">Обновить копию</button><button class="btn tight" data-action="close">Закрыть</button></div></div>`;
 back.classList.add('show');back.setAttribute('aria-hidden','false');
}
function initStorage(){
 const api=storeApi();if(!api)return;
 if(S.schemaVersion!==2){S.schemaVersion=2;try{localStorage.setItem(STORE,JSON.stringify(S))}catch(e){}}
 try{api.runMigrations([])}catch(e){}
 // Ask the browser to keep localStorage/IndexedDB durable across eviction.

function updateTaskPreview(form){
 if(!form)return;const el=document.getElementById('taskPreview');if(!el)return;
 const fd=new FormData(form);
 const name=String(fd.get('name')||'').trim()||'Новое дело';
 const date=fd.get('fromDate')||ui.date;
 const start=fd.get('start')||'--:--',end=fd.get('end')||'--:--';
 const mode=fd.get('repeat')||'once',interval=Math.max(1,Math.min(90,Number(fd.get('interval'))||2));
 const labels={once:'один раз',daily:'каждый день',weekly:'раз в неделю',biweekly:'раз в две недели',everyN:'каждые '+interval+' дн.',parity:'по чётности недели',weekdays:'по выбранным дням'};
 const parentId=fd.get('parentId');const parent=parentId?itemList(ui.date).find(x=>x.id===parentId):null;
 const parts=[name,dateTitle(date)+', '+start+'–'+end,labels[mode]||mode];
 if(parent)parts.push('внутри «'+parent.name+'»');
 el.textContent=parts.join(' · ');
}
document.addEventListener('input',e=>{if(e.target.closest?.('#taskform'))updateTaskPreview(e.target.form)},true);
document.addEventListener('change',e=>{if(e.target.closest?.('#taskform'))updateTaskPreview(e.target.form)},true);
document.addEventListener('click',e=>{const b=e.target.closest?.('[data-dur]');if(!b)return;const form=b.closest('#taskform');if(!form)return;e.preventDefault();const start=form.elements.start.value;if(!/^\d{2}:\d{2}$/.test(start))return;form.elements.end.value=niceTime(minutesHM(start)+(Number(b.dataset.dur)||5));updateTaskPreview(form);},true);

setInterval(()=>{timerTick();let date=today();if(date!==lastToday){lastToday=date;if(ui.date===lastSelectedDate){ui.date=date;ui.week=monday(date);render()}lastSelectedDate=date}},1000);

 if(e.target.id==='repeatSel'){syncRepeatFields(e.target.value);return}

 if(e.target.id==='importFile'){let f=e.target.files?.[0];if(f)f.text().then(async x=>{try{let parsed=JSON.parse(x);const pack=(parsed&&parsed.state&&typeof parsed.state==='object')?parsed:null;let next=pack?parsed.state:parsed;if(!validStateImport(next))throw Error('format');if(confirm('Заменить текущие данные?'+(pack?' Будут восстановлены состояние, память и чаты.':'')+' Предыдущая копия будет сохранена локально.')){
 const candidate={done:{},habits:{},overrides:{},extras:[],logs:{},anchor:null,shave:null,wakeTimes:{},...next};

 let fullChats=null;try{if(window.JarvisChatStore)fullChats=await window.JarvisChatStore.loadAll();}catch(err){}localStorage.setItem('jarvis_routine_before_import_v1',JSON.stringify({state:before,memory:localStorage.getItem('jarvis_memory_v1'),chats:localStorage.getItem('jarvis_qwen_chats_v1'),chatsFull:fullChats,importedAt:new Date().toISOString()}));
 S=candidate;
 // A quota failure must not leave the user with half-imported data.
 if(!persist()){try{S=JSON.parse(before)}catch(err){S={done:{},habits:{},overrides:{},extras:[],logs:{},anchor:null,shave:null,wakeTimes:{}}}persist();toast('Импорт отменён: не удалось сохранить');return}
 if(pack&&pack.memory){try{localStorage.setItem('jarvis_memory_v1',JSON.stringify(pack.memory))}catch(err){}}
  let chatsOk=true,chatsError='';if(pack&&Array.isArray(pack.chats)&&pack.chats.length){const list=pack.chats.map(c=>({id:c.id||('c_'+Math.random().toString(36).slice(2,8)),title:c.title||'Чат',createdAt:c.createdAt||Date.now(),updatedAt:c.updatedAt||Date.now(),messages:Array.isArray(c.messages)?c.messages:[]}));localStorage.setItem('jarvis_qwen_chats_v1',JSON.stringify({active:list[0].id,list:list.map(c=>({...c,messages:(c.messages||[]).slice(-35)}))}));try{if(window.JarvisChatStore){chatsOk=pack.chatsFull?await window.JarvisChatStore.replaceAll(list):await window.JarvisChatStore.mirrorAll(list);if(chatsOk){const n=await window.JarvisChatStore.count();if(!n||n.chats<list.length)chatsOk=false;}}}catch(err){chatsOk=false;chatsError=(err&&err.message)||String(err);}}
  render();if(!chatsOk){toast('Расписание и память восстановлены, но чаты сохранить не удалось'+(chatsError?' ('+chatsError+')':''));return}toast('Данные восстановлены; предыдущая копия сохранена');if(pack)setTimeout(()=>{try{location.reload()}catch(err){}},900)
 }}catch(e){toast('Неверный файл')}})}
});
document.addEventListener('submit',e=>{if(e.target.getAttribute('id')!=='taskform')return;e.preventDefault();let form=e.target,fd=new FormData(form),raw=Object.fromEntries(fd.entries()),id=raw.id;let item={name:raw.name.trim(),start:raw.start,end:raw.end,cat:raw.cat,status:raw.status,note:raw.note.trim()};if(!item.name)return;const fromDate=raw.fromDate||ui.date,parentId=raw.parentId||'';const spec=repeatSpec(raw,fd.getAll?fd.getAll('repeatDay'):[]);if(id&&id.startsWith('p'))S.overrides[id]=item;else if(id){let t=S.extras.find(x=>x.id===id);if(!t)return;if(isRecurringTask(t)&&confirm('Изменить только повторение '+ui.date+'? Отмена — вся серия.')){(S.dayAdjust[ui.date]||={})[id]={...item}}else Object.assign(t,item,spec,{fromDate,fixedTime:true,parentId:parentId||t.parentId||undefined})}else S.extras.push({id:'x_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),...item,fromDate,fixedTime:true,parentId:parentId||undefined,...spec});const ok=persist();modalClose();render();toast(ok?'Дело сохранено':'Не удалось сохранить — выгрузите копию')});
document.addEventListener('click',e=>{let btn=e.target.closest('[data-action]');if(!btn)return;let a=btn.dataset.action;

 else if(a==='now'){ui.date=today();ui.week=monday(ui.date);ui.tab='today';render();window.scrollTo(0,0)}

 else if(a==='close')modalClose()
 else if(a==='delete'){let id=btn.dataset.id;if(id.startsWith('p')){if(!confirm('Убрать это дело из расписания?'))return;S.overrides[id]={...(S.overrides[id]||{}),deleted:true}}
  else{const t=S.extras.find(x=>x.id===id);
   if(isRecurringTask(t)){

    if(confirm('Повторяющееся дело. Убрать только '+ui.date+'?'))t.exceptions=[...(t.exceptions||[]),ui.date];

    else return;

  persist();modalClose();render()}
 else if(a==='log'){let d=ui.date,field=btn.dataset.field,delta=Number(btn.dataset.delta);(S.logs[d]??={})[field]=Math.max(0,(Number(S.logs[d][field])||0)+delta);persist();render()}

 else if(a==='import')document.querySelector('#importFile').click()
 else if(a==='clearDay'){if(confirm('Сбросить все галочки за '+ui.date+'?')){delete S.done[ui.date];delete S.habits[ui.date];persist();render()}}

 else if(a==='expandTask'){let id=btn.dataset.taskId;if(id){let det=document.querySelector('#detail_'+id);if(det){e.stopPropagation();det.classList.toggle('open')}}}
 // v42: quick actions on the "now" hero card
